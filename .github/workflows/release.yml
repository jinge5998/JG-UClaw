name: 🚀 Auto Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 5.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate version.json
        run: |
          python3 -c "
          import json
          with open('version.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          required = ['version', 'releaseDate', 'downloadUrl', 'changelog']
          for field in required:
              if field not in data:
                  raise Exception(f'Missing required field: {field}')
          print('✅ version.json is valid')
          print(f'Version: {data[\"version\"]}')
          print(f'Release Date: {data[\"releaseDate\"]}')
          "
          
      - name: Check version format
        run: |
          VERSION=$(jq -r '.version' version.json)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi
          echo "✅ Version format is valid: $VERSION"

  create-release:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version info
        id: version
        run: |
          VERSION=$(jq -r '.version' version.json)
          RELEASE_DATE=$(jq -r '.releaseDate' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          
      - name: Generate changelog
        id: changelog
        run: |
          echo "### 📝 更新日志" > release_notes.md
          echo "" >> release_notes.md
          jq -r '.changelog[] | "- **\(.type)**: \(.description)"' version.json >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 版本信息" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **版本号**: ${{ steps.version.outputs.version }}" >> release_notes.md
          echo "- **发布日期**: ${{ steps.version.outputs.release_date }}" >> release_notes.md
          echo "- **最低版本**: $(jq -r '.minVersion' version.json)" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔗 下载地址" >> release_notes.md
          echo "" >> release_notes.md
          echo "- 百度网盘: ${{ jq -r '.downloadUrl' version.json }}" >> release_notes.md
          if [ "$(jq -r '.downloadPassword' version.json)" != "null" ]; then
            echo "  - 提取码: $(jq -r '.downloadPassword' version.json)" >> release_notes.md
          fi
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenClaw v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Send notification
        run: |
          echo "### 🎉 Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: v${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Clients will receive update notification within minutes!" >> $GITHUB_STEP_SUMMARY
