name: 🚀 Auto Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 5.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证 version.json
        run: |
          python3 -c "
import json
import sys

with open('version.json', 'r', encoding='utf-8') as f:
    data = json.load(f)

required_fields = ['version', 'releaseDate', 'downloadUrl', 'changelog']
for field in required_fields:
    if field not in data:
        print(f'❌ 缺少必填字段: {field}')
        sys.exit(1)

print(f'✅ version.json 验证通过')
print(f'版本: {data[\"version\"]}')
print(f'发布日期: {data[\"releaseDate\"]}')
print(f'下载链接: {data[\"downloadUrl\"]}')
print(f'更新日志数量: {len(data[\"changelog\"])}')
"

      - name: 验证版本号格式
        run: |
          VERSION=$(jq -r '.version' version.json)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ 无效的版本号格式: $VERSION"
            exit 1
          fi
          echo "✅ 版本号格式正确: $VERSION"

  create-release:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本信息
        id: version
        run: |
          VERSION=$(jq -r '.version' version.json)
          RELEASE_DATE=$(jq -r '.releaseDate' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT

      - name: 生成发布说明
        run: |
          cat > release_notes.md << 'EOF'
          ## 📦 OpenClaw UClaw v${{ steps.version.outputs.version }}

          **发布日期**: ${{ steps.version.outputs.release_date }}

          ---

          ## 📝 更新日志

          EOF
          jq -r '.changelog[] | "- **\(.type)**: \(.description)"' version.json >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 🔗 下载地址" >> release_notes.md
          echo "" >> release_notes.md
          echo "- 百度网盘: $(jq -r '.downloadUrl' version.json)" >> release_notes.md
          if [ "$(jq -r '.downloadPassword' version.json)" != "null" ]; then
            echo "  - 提取码: $(jq -r '.downloadPassword' version.json)" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "## 📋 系统要求" >> release_notes.md
          echo "" >> release_notes.md
          echo "- 操作系统: $(jq -r '.requirements.os // \"Windows 10/11\"' version.json)" >> release_notes.md
          echo "- 磁盘空间: $(jq -r '.requirements.diskSpace // \"500MB\"' version.json)" >> release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenClaw UClaw v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 latest 标签
        run: |
          git tag -f latest
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: 显示成功信息
        run: |
          echo "## 🎉 发布成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: **v${{ needs.create-release.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 版本验证通过" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitHub Release 已创建" >> $GITHUB_STEP_SUMMARY
          echo "✅ latest 标签已更新" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**客户端将在几分钟内收到更新通知！**" >> $GITHUB_STEP_SUMMARY
